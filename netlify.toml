# GIO4X: Netlify build. Next.js is served by the official runtime plugin.
# Security headers and redirects are defined once, in next.config.mjs, so they
# are identical on every host and in local development.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # The client and IB portal (the portal/ folder, its own Netlify site) is
  # served by this site at /portal. Not a secret: it is the address of that
  # site. Remove the line to disconnect the portal.
  PORTAL_ORIGIN = "https://zippy-piroshki-21aa30.netlify.app"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Indexing is controlled by NEXT_PUBLIC_SITE_ENV, set per site in the Netlify UI:
#   "production" on the site that serves the real domain (indexable),
#   anything else (e.g. "preview") everywhere else: noindex + Disallow: /.
# It is deliberately not set here, so a preview site can never be indexed by
# accident. Deploy previews and branch deploys are always forced to "preview".

# The offline worker and its kill switch (docs/OFFLINE.md). These two are files
# in public/, which Netlify serves from its CDN without the headers of
# next.config.mjs, so their cache rule is stated here: always revalidated, so a
# new worker, or the kill switch, is picked up on the next page load.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/sw-off.txt"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"

[context.deploy-preview.environment]
  NEXT_PUBLIC_SITE_ENV = "preview"

[context.branch-deploy.environment]
  NEXT_PUBLIC_SITE_ENV = "preview"
